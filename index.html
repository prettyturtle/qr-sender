<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <!-- The privacy claim is "nothing leaves this browser". Enforce it in the
         browser rather than relying on the absence of a fetch call: no origin
         but this one is reachable, so a future dependency cannot quietly add
         one. wasm-unsafe-eval is required by the zxing decoder. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; frame-src blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e11" />
    <meta
      name="description"
      content="Transfer files with no network — a screen displays QR frames, a camera reads them. Everything stays in your browser."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Safari reads none of this from the manifest. Without `apple-mobile-web-app-capable`
         the app opens in a Safari chrome *and* every startup image below is ignored. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default`, not `black-translucent`. Translucent draws the web view under
         the status bar and forces its text white, which is correct on this
         app's dark theme and invisible on its light one. `default` follows the
         system appearance instead, so the clock stays readable either way, and
         iOS reserves the bar rather than leaving the app to inset around it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="QR Sender" />
    <title>QR Sender</title>
