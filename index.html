<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- The privacy claim is "nothing leaves this browser". Enforce it in the
         browser rather than relying on the absence of a fetch call: no origin
         but this one is reachable, so a future dependency cannot quietly add
         one. wasm-unsafe-eval is required by the zxing decoder. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e11" />
    <meta
      name="description"
      content="Transfer files with no network — a screen displays QR frames, a camera reads them. Everything stays in your browser."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>QR Sender</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
